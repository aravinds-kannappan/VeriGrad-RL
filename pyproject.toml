[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verigrad-rl"
version = "0.4.0"
description = "Propensity benchmark for frontier models + a verifiable-reward RL baseline, with an Inspect AI adapter."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "VeriGrad RL contributors"}]
keywords = ["ai-safety", "evals", "propensity", "sycophancy", "inspect-ai", "reinforcement-learning", "language-agents", "verifiers"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
verigrad = "verigrad_rl.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
ml = ["torch>=2.3"]
llm = ["anthropic>=0.40", "certifi>=2024.0"]
# Run the propensity probes through the UK AISI Inspect framework against any
# provider (Anthropic, OpenAI, Google, local). See verigrad_rl/integrations.
inspect = ["inspect-ai>=0.3", "certifi>=2024.0"]

[tool.setuptools.packages.find]
include = ["verigrad_rl*"]

[tool.ruff]
line-length = 100
target-version = "py310"
