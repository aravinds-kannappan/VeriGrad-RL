<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" role="img" aria-labelledby="title desc">
  <title id="title">VeriGrad RL training curve</title>
  <desc id="desc">Train and held-out evaluation accuracy over a 50 episode verifier-guided RL run.</desc>
  <style>
    .bg { fill: #fbfaf7; }
    .axis { stroke: #1f2933; stroke-width: 1.5; }
    .grid { stroke: #d9e2ec; stroke-width: 1; }
    .train { fill: none; stroke: #0f766e; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    .eval { fill: none; stroke: #b45309; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    .label { fill: #1f2933; font: 700 20px system-ui, sans-serif; }
    .small { fill: #52606d; font: 14px system-ui, sans-serif; }
    .tick { fill: #52606d; font: 12px system-ui, sans-serif; text-anchor: end; }
  </style>
  <rect class="bg" width="860" height="420" rx="0"/>
  <text x="70" y="25" class="label">Arithmetic smoke test: verifier behavior in 50 episodes</text>
  <line x1="70" y1="40.0" x2="830" y2="40.0" class="grid"/>
<line x1="70" y1="120.0" x2="830" y2="120.0" class="grid"/>
<line x1="70" y1="200.0" x2="830" y2="200.0" class="grid"/>
<line x1="70" y1="280.0" x2="830" y2="280.0" class="grid"/>
<line x1="70" y1="360.0" x2="830" y2="360.0" class="grid"/>
  <text x="30" y="45.0" class="tick">1.00</text>
<text x="30" y="125.0" class="tick">0.75</text>
<text x="30" y="205.0" class="tick">0.50</text>
<text x="30" y="285.0" class="tick">0.25</text>
<text x="30" y="365.0" class="tick">0.00</text>
  <line x1="70" y1="360" x2="830" y2="360" class="axis"/>
  <line x1="70" y1="40" x2="70" y2="360" class="axis"/>
  <path d="M146.0,360.0 L222.0,360.0 L298.0,360.0 L374.0,40.0 L450.0,52.8 L526.0,46.4 L602.0,40.0 L678.0,40.0 L754.0,40.0 L830.0,40.0" class="train"/>
  <path d="M146.0,360.0 L222.0,360.0 L298.0,360.0 L374.0,40.0 L450.0,40.0 L526.0,40.0 L602.0,40.0 L678.0,40.0 L754.0,40.0 L830.0,40.0" class="eval"/>
  <text x="630" y="78" class="small">Train accuracy</text>
  <line x1="590" y1="73" x2="620" y2="73" class="train"/>
  <text x="630" y="104" class="small">Held-out eval accuracy</text>
  <line x1="590" y1="99" x2="620" y2="99" class="eval"/>
  <text x="430.0" y="402" class="small" text-anchor="middle">Episode</text>
  <text x="18" y="210.0" class="small" text-anchor="middle" transform="rotate(-90 18 210.0)">Accuracy</text>
</svg>
