<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" role="img" aria-labelledby="title desc">
  <title id="title">Behavior logits before and after intervention</title>
  <desc id="desc">Grouped bars compare behavior logits before and after a targeted safety intervention.</desc>
  <style>
    .bg { fill: #fbfaf7; }
    .axis { stroke: #1f2933; stroke-width: 1.5; }
    .grid { stroke: #d9e2ec; stroke-width: 1; }
    .label { fill: #1f2933; font: 700 20px system-ui, sans-serif; }
    .small { fill: #52606d; font: 14px system-ui, sans-serif; }
    .tick { fill: #52606d; font: 12px system-ui, sans-serif; }
  </style>
  <rect class="bg" width="920" height="420"/>
  <text x="70" y="34" class="label">Behavior logits before vs. after targeted intervention</text>
  <line x1="65" y1="240" x2="840" y2="240" class="axis"/>
  <rect x="90" y="120.0" width="30" height="120.0" fill="#b45309" rx="3"/><rect x="128" y="238.7" width="30" height="1.3" fill="#0f766e" rx="3"/><text x="124" y="305" class="tick" text-anchor="middle">harmful_completion</text><rect x="210" y="240" width="30" height="22.3" fill="#b45309" rx="3"/><rect x="248" y="230.6" width="30" height="9.4" fill="#0f766e" rx="3"/><text x="244" y="305" class="tick" text-anchor="middle">helpful_answer</text><rect x="330" y="150.8" width="30" height="89.2" fill="#b45309" rx="3"/><rect x="368" y="193.1" width="30" height="46.9" fill="#0f766e" rx="3"/><text x="364" y="305" class="tick" text-anchor="middle">safe_refusal</text><rect x="450" y="235.8" width="30" height="4.2" fill="#b45309" rx="3"/><rect x="488" y="224.1" width="30" height="15.9" fill="#0f766e" rx="3"/><text x="484" y="305" class="tick" text-anchor="middle">clarifying_question</text>
  <rect x="650" y="76" width="18" height="18" fill="#b45309"/><text x="676" y="91" class="small">Before patch</text>
  <rect x="650" y="106" width="18" height="18" fill="#0f766e"/><text x="676" y="121" class="small">After patch</text>
</svg>
